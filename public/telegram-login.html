<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ultar WBD</title><link rel="stylesheet" href="/styles.css"><style>.login-page{min-height:100vh;display:grid;place-items:center;background:#000;padding:20px}.login-card{width:min(390px,100%);background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 22px 60px #00000073}.login-card .brand{justify-content:center;margin-bottom:22px}.login-card h1{font-size:1.65rem;margin:0 0 12px;color:var(--ink)}.login-form{display:grid;gap:12px}.login-form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;font:inherit}.login-form button,.code-form button{border:0;border-radius:6px;padding:13px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.google-btn,.text-btn{display:block;margin-top:10px;color:var(--blue);font-size:.82rem;font-weight:700;text-decoration:none;cursor:pointer}.login-error{display:none;color:#b42318;font-size:.8rem;margin:10px 0 0}.login-error.visible{display:block}.register-prompt{margin:14px 0 0;color:var(--muted);font-size:.82rem}.register-prompt a{color:var(--blue);font-weight:700;cursor:pointer}.code-form{display:none;margin-top:16px;gap:10px}.code-form.visible{display:grid}.code-form input{padding:12px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:center;letter-spacing:.18em}.mode-note{font-size:.8rem;color:var(--muted);margin:0 0 16px}</style></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><img class="brand-logo" src="/ultar-sync-logo.jpg" alt="Ultar Sync logo"><span>Ultar WBD</span></a><h1 id="title">Login</h1><p class="mode-note" id="note">Sign in with your email and password.</p><form class="login-form" id="form"><input id="email" type="email" placeholder="Email address" required><input id="password" type="password" placeholder="Password" required><button id="submit">Login</button></form><a class="google-btn" href="/auth/google">Continue with Google</a><a class="text-btn" id="forgot">Forgot password?</a><form class="code-form" id="codeForm"><input id="code" inputmode="numeric" maxlength="6" placeholder="Verification code" required><input id="newPassword" type="password" placeholder="New password (8+ characters)"><button id="codeSubmit">Verify code</button></form><p class="login-error" id="error"></p><p class="register-prompt" id="prompt">New user? <a id="register">Register now</a></p></main><script>
const $=x=>document.getElementById(x),form=$('form'),codeForm=$('codeForm'),error=$('error');let mode='login',email='';
function err(x){error.textContent=x;error.classList.add('visible')}function clear(){error.classList.remove('visible')}
function setMode(next){mode=next;clear();$('title').textContent=next==='register'?'Create account':next==='reset'?'Reset password':'Login';$('note').textContent=next==='register'?'Use your email and a password to get started.':next==='reset'?'Enter your email to receive a reset code.':'Sign in with your email and password.';$('password').style.display=next==='reset'?'none':'block';$('submit').textContent=next==='register'?'Create account':next==='reset'?'Send reset code':'Login';$('forgot').style.display=next==='reset'?'none':'block';$('prompt').innerHTML=next==='login'?'New user? <a id="register">Register now</a>':'<a id="back">Back to login</a>';if($('register'))$('register').onclick=()=>setMode('register');if($('back'))$('back').onclick=()=>location.reload()}
$('register').onclick=()=>setMode('register');$('forgot').onclick=()=>setMode('reset');
form.onsubmit=async e=>{e.preventDefault();clear();email=$('email').value.trim().toLowerCase();const password=$('password').value;try{const endpoint=mode==='register'?'/auth/register':mode==='reset'?'/auth/password-reset/request':'/auth/password-login';const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!d.success)return err(d.message||'Unable to continue.');if(mode==='login')return location.href='/apps';codeForm.classList.add('visible');form.style.display='none';$('forgot').style.display='none';$('title').textContent=mode==='reset'?'Enter reset code':'Verify email';$('note').textContent='Enter the 6-digit code sent to your email.';$('newPassword').style.display=mode==='reset'?'block':'none';$('codeSubmit').textContent=mode==='reset'?'Reset password':'Verify email'}catch{err('Service temporarily unavailable.')}};
codeForm.onsubmit=async e=>{e.preventDefault();clear();const endpoint=mode==='reset'?'/auth/password-reset/complete':'/auth/register/verify';const body=mode==='reset'?{email,code:$('code').value.trim(),password:$('newPassword').value}:{email,code:$('code').value.trim()};try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!d.success)return err(d.message||'Invalid or expired code.');location.reload()}catch{err('Verification service temporarily unavailable.')}};
</script></body></html>
