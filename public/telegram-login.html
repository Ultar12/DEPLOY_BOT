<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Ultar Sync</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-page{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07182d,#173d62);padding:20px}.login-card{width:min(390px,100%);background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.25)}.login-card .brand{justify-content:center;margin-bottom:22px}.login-card h1{font-size:1.65rem;margin:0 0 22px;color:var(--ink)}.login-form{display:grid;gap:12px}.login-form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;font:inherit;outline:none}.login-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,145,.12)}.login-form button{border:0;border-radius:6px;padding:13px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.login-form button:hover{background:var(--blue)}.telegram-wrap{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.telegram-wrap.visible{display:block}.telegram-wrap p{margin:0 0 12px;color:var(--muted);font-size:.8rem}.telegram-login{min-height:44px;display:flex;justify-content:center}.login-error{display:none;color:#b42318;font-size:.8rem;margin:10px 0 0}.login-error.visible{display:block}
  </style>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/"><img class="brand-logo" src="/ultar-sync-logo.jpg" alt="Ultar Sync logo"><span>Ultar Sync</span></a>
    <h1>Login</h1>
    <form class="login-form" id="login-form">
      <input id="identifier" name="identifier" type="text" placeholder="Email address or Telegram user ID" autocomplete="username" required>
      <button type="submit">Login</button>
    </form>
    <p class="login-error" id="login-error">Enter your email address or Telegram user ID.</p>
    <div class="telegram-wrap" id="telegram-wrap">
      <p>Verify your identity with Telegram to continue.</p>
      <div class="telegram-login" id="telegram-login"></div>
    </div>
  </main>
  <script>
    function onTelegramAuth(user) {
      const query = new URLSearchParams(user);
      window.location.href = '/telegram-auth?' + query.toString() + '&next=/apps';
    }
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const error = document.getElementById('login-error');
      if (!identifier) { error.classList.add('visible'); return; }
      error.classList.remove('visible');
      sessionStorage.setItem('ultar_login_identifier', identifier);
      document.getElementById('telegram-wrap').classList.add('visible');
      if (!document.getElementById('telegram-widget-script')) {
        const script = document.createElement('script');
        script.id = 'telegram-widget-script';
        script.src = 'https://telegram.org/js/telegram-widget.js?22';
        script.setAttribute('data-telegram-login', 'ultarbotdeploybot');
        script.setAttribute('data-size', 'large');
        script.setAttribute('data-radius', '6');
        script.setAttribute('data-userpic', 'false');
        script.setAttribute('data-request-access', 'write');
        script.setAttribute('data-onauth', 'onTelegramAuth(user)');
        script.async = true;
        document.getElementById('telegram-login').appendChild(script);
      }
    });
  </script>
</body>
</html>
