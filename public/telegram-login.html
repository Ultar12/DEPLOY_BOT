<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Ultar WBD</title><link rel="stylesheet" href="/styles.css">
<style>.login-page{min-height:100vh;display:grid;place-items:center;background:#000;padding:20px}.login-card{width:min(390px,100%);background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.45)}.login-card .brand{justify-content:center;margin-bottom:22px}.login-card h1{font-size:1.65rem;margin:0 0 22px;color:var(--ink)}.login-form{display:grid;gap:12px}.login-form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;font:inherit;outline:none}.login-form button{border:0;border-radius:6px;padding:13px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.login-form button:hover{background:var(--blue)}.login-error{display:none;color:#b42318;font-size:.8rem;margin:10px 0 0}.login-error.visible{display:block}.register-prompt{margin:14px 0 0;color:var(--muted);font-size:.82rem}.register-prompt a{color:var(--blue);font-weight:700}.code-form{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.code-form.visible{display:grid;gap:10px}.code-form input{padding:12px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:center;letter-spacing:.18em}.code-form button{border:0;border-radius:6px;padding:12px;background:#1f9d63;color:#fff;font:inherit;font-weight:700;cursor:pointer}</style>
</head>
<body class="login-page"><main class="login-card"><a class="brand" href="/"><img class="brand-logo" src="/ultar-sync-logo.jpg" alt="Ultar Sync logo"><span>Ultar WBD</span></a><h1>Login</h1><form class="login-form" id="login-form"><input id="identifier" type="text" placeholder="Email address or Telegram user ID" autocomplete="username" required><button type="submit">Login</button></form><p class="login-error" id="login-error">Enter your email address or Telegram user ID.</p><form class="code-form" id="code-form"><input id="code" inputmode="numeric" maxlength="6" placeholder="Verification code" required><button type="submit">Verify code</button></form><p class="register-prompt">New user? <a href="https://t.me/ultarswbdbot?start=web_register" target="_blank" rel="noopener">Register now</a></p></main>
<script>
const loginForm=document.getElementById('login-form'),codeForm=document.getElementById('code-form'),identifierInput=document.getElementById('identifier'),error=document.getElementById('login-error');
loginForm.addEventListener('submit',async e=>{e.preventDefault();const identifier=identifierInput.value.trim();if(!identifier){error.textContent='Enter your email address or Telegram user ID.';error.classList.add('visible');return}error.classList.remove('visible');try{const r=await fetch('/auth/login?identifier='+encodeURIComponent(identifier));const d=await r.json();if(!d.success){error.textContent=d.message||'Not found.';error.classList.add('visible');return}if(d.requiresCode){sessionStorage.setItem('ultar_login_identifier',identifier);codeForm.classList.add('visible');error.textContent='A verification code was sent to your Telegram chat.';error.classList.add('visible');}else{window.location.href='/apps';}}catch{error.textContent='Login service temporarily unavailable.';error.classList.add('visible')}});
codeForm.addEventListener('submit',async e=>{e.preventDefault();const identifier=sessionStorage.getItem('ultar_login_identifier')||identifierInput.value.trim(),code=document.getElementById('code').value.trim();try{const r=await fetch('/auth/verify-code?identifier='+encodeURIComponent(identifier)+'&code='+encodeURIComponent(code));const d=await r.json();if(!d.success){error.textContent=d.message||'Invalid or expired code.';error.classList.add('visible');return}window.location.href='/apps';}catch{error.textContent='Login service temporarily unavailable.';error.classList.add('visible')}});
</script></body></html>
