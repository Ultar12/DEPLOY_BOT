<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Ultar WBD</title>
  <link rel="icon" href="/ultar-sync-logo.jpg">
  <style>
    :root { --bg:#0b0b0c; --card:#141416; --ink:#f3efe6; --muted:#9a958b; --line:#2a2927; --accent:#e8ff47; --danger:#ff6b62; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family: Inter, "Segoe UI", sans-serif; padding:24px; }
    .card { width:min(400px,100%); background:var(--card); border:1px solid var(--line); padding:28px 24px 24px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; margin-bottom:22px; }
    .brand img { width:36px; height:36px; border-radius:50%; object-fit:cover; }
    h1 { margin:0 0 6px; font-size:1.55rem; font-weight:560; }
    .note { color:var(--muted); font-size:.92rem; margin:0 0 18px; }
    form { display:grid; gap:10px; }
    input { width:100%; padding:12px 13px; border:1px solid var(--line); background:#0f0f11; color:var(--ink); font:inherit; }
    button, .google { border:0; padding:12px; font:inherit; font-weight:650; cursor:pointer; }
    .primary { background:var(--accent); color:#111; }
    .primary:disabled { opacity:.65; cursor:wait; }
    .google { display:block; text-align:center; text-decoration:none; color:var(--ink); border:1px solid var(--line); background:transparent; }
    .row { display:flex; justify-content:space-between; gap:12px; margin-top:12px; font-size:.82rem; }
    .row a, .switch { color:var(--accent); cursor:pointer; text-decoration:none; }
    .error { display:none; color:var(--danger); font-size:.82rem; margin:0 0 12px; }
    .error.on { display:block; }
    .hidden { display:none !important; }
    .code { letter-spacing:.12em; text-align:center; text-transform:uppercase; }
    .spin { width:14px; height:14px; border:2px solid #1116; border-top-color:#111; border-radius:50%; display:inline-block; animation:s .7s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes s { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/"><img src="/ultar-sync-logo.jpg" alt=""><span>Ultar WBD</span></a>
    <h1 id="title">Sign in</h1>
    <p class="note" id="note">Use email and password, or Google.</p>
    <p class="error" id="error"></p>
    <form id="form">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <input id="password2" class="hidden" type="password" placeholder="Confirm password" autocomplete="new-password">
      <button class="primary" id="submit" type="submit">Continue</button>
    </form>
    <a class="google" id="googleBtn" href="/auth/google" style="margin-top:10px">Continue with Google</a>
    <form id="codeForm" class="hidden" style="margin-top:14px">
      <input id="code" class="code" maxlength="12" placeholder="LOGIN CODE" autocomplete="one-time-code" required>
      <input id="newPassword" class="hidden" type="password" placeholder="New password" minlength="8">
      <button class="primary" id="codeSubmit" type="submit">Verify</button>
    </form>
    <div class="row">
      <a href="#" id="forgot">Forgot password</a>
      <span class="switch" id="toggle">Create account</span>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let mode = 'login';
    let email = '';
    const setError = msg => { $('error').textContent = msg || ''; $('error').classList.toggle('on', Boolean(msg)); };
    const busy = (btn, label) => { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + label; };
    const ready = (btn, label) => { btn.disabled = false; btn.textContent = label; };
    const show = (el, on) => el.classList.toggle('hidden', !on);
    function setMode(next) {
      mode = next;
      setError('');
      show($('form'), next !== 'code');
      show($('codeForm'), next === 'code');
      show($('googleBtn'), next === 'login' || next === 'register');
      show($('password'), next === 'login' || next === 'register' || next === 'reset');
      show($('password2'), next === 'register');
      show($('newPassword'), false);
      $('password').required = next === 'login' || next === 'register' || next === 'reset';
      const titles = { login: ['Sign in', 'Use email and password, or Google.'], register: ['Create account', 'Choose an email and password. We will email a verification code.'], reset: ['Reset password', 'Enter your email. We will send a reset code.'], code: ['Check your email', 'Enter the code we sent.'] };
      $('title').textContent = titles[next][0];
      $('note').textContent = titles[next][1];
      ready($('submit'), next === 'register' ? 'Create account' : next === 'reset' ? 'Send reset code' : 'Continue');
      $('toggle').textContent = next === 'login' ? 'Create account' : 'Back to sign in';
    }
    $('toggle').onclick = () => setMode(mode === 'login' ? 'register' : 'login');
    $('forgot').onclick = ev => { ev.preventDefault(); setMode('reset'); };
    $('googleBtn').onclick = () => { $('googleBtn').textContent = 'Opening Google…'; };
    async function post(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) throw new Error(data.message || 'Please try again.');
      return data;
    }
    $('form').onsubmit = async ev => {
      ev.preventDefault();
      setError('');
      email = $('email').value.trim().toLowerCase();
      const password = $('password').value;
      if (mode === 'register' && password !== $('password2').value) return setError('Passwords do not match.');
      busy($('submit'), mode === 'register' ? 'Creating…' : mode === 'reset' ? 'Sending…' : 'Signing in…');
      try {
        if (mode === 'login') {
          await post('/auth/password-login', { email, password });
          location.href = '/apps/dashboard';
          return;
        }
        if (mode === 'register') {
          await post('/auth/register', { email, password });
          setMode('code');
          $('codeForm').dataset.purpose = 'signup';
          return;
        }
        await post('/auth/password-reset/request', { email });
        setMode('code');
        $('codeForm').dataset.purpose = 'reset';
        show($('newPassword'), true);
        $('note').textContent = 'Enter the email code and your new password.';
      } catch (err) {
        ready($('submit'), mode === 'register' ? 'Create account' : mode === 'reset' ? 'Send reset code' : 'Continue');
        setError(err.message);
      }
    };
    $('codeForm').onsubmit = async ev => {
      ev.preventDefault();
      setError('');
      const code = $('code').value.trim();
      const purpose = $('codeForm').dataset.purpose || 'login';
      busy($('codeSubmit'), 'Verifying…');
      try {
        if (purpose === 'signup') {
          await post('/auth/register/verify', { email, code });
        } else if (purpose === 'reset') {
          const password = $('newPassword').value;
          if (password.length < 8) throw new Error('New password must be at least 8 characters.');
          await post('/auth/password-reset/complete', { email, code, password });
        } else {
          await post('/auth/verify-code', { identifier: email, code });
        }
        location.href = '/apps/dashboard';
      } catch (err) {
        ready($('codeSubmit'), 'Verify');
        setError(err.message);
      }
    };
  </script>
</body>
</html>
