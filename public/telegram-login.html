<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ultar WBD</title><link rel="stylesheet" href="/styles.css"><style>.login-page{min-height:100vh;display:grid;place-items:center;background:#000;color:#111;padding:20px}.login-card{width:min(390px,100%);background:#fff;color:#111;border-radius:12px;padding:30px;text-align:center;box-shadow:0 22px 60px #00000073}.login-card .brand{justify-content:center;margin-bottom:22px;color:#111}.login-card h1{font-size:1.65rem;margin:0 0 12px;color:#111}.login-form{display:grid;gap:12px}.login-form input{width:100%;padding:13px 14px;border:1px solid #c9c9c9;border-radius:6px;background:#fff;color:#111;font:inherit}.login-form button,.code-form button{border:0;border-radius:6px;padding:13px;background:#000;color:#fff;font:inherit;font-weight:700;cursor:pointer}.login-form button:disabled,.code-form button:disabled{opacity:.7;cursor:wait}.auth-loading{display:inline-flex;align-items:center;justify-content:center;gap:9px}.auth-spinner{width:15px;height:15px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:auth-spin .7s linear infinite}@keyframes auth-spin{to{transform:rotate(360deg)}}.google-btn{display:block;margin-top:10px;color:#202124;border:1px solid #dadce0;border-radius:6px;padding:11px;font-size:.82rem;font-weight:700;text-decoration:none}.google-btn.loading{opacity:.7;pointer-events:none}.google-logo{width:18px;height:18px;vertical-align:middle;margin-right:8px}.login-error{display:none;color:#b42318;font-size:.8rem;margin:10px 0 0}.login-error.visible{display:block}.register-prompt{margin:14px 0 0;color:#5e5e5e;font-size:.82rem}.register-prompt a{color:#111;font-weight:700;cursor:pointer}.code-form{display:none;margin-top:16px;gap:10px}.code-form.visible{display:grid}.code-form input{padding:12px;border:1px solid #c9c9c9;border-radius:6px;background:#fff;color:#111;font:inherit;text-align:center;letter-spacing:.18em}.mode-note{font-size:.8rem;color:#5e5e5e;margin:0 0 6px}</style></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><img class="brand-logo" src="/ultar-sync-logo.jpg" alt="Ultar Sync logo"><span>Ultar WBD</span></a><h1 id="title">Login</h1><p class="mode-note" id="note">Sign in with your email and password.</p><p class="login-error" id="error"></p><form class="login-form" id="form"><input id="email" type="email" placeholder="Email address" required><input id="password" type="password" placeholder="Password" required><button id="submit">Login</button></form><a class="google-btn" id="googleBtn" href="/auth/google"><img class="google-logo" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Continue with Google</a><form class="code-form" id="codeForm"><input id="code" inputmode="numeric" maxlength="6" placeholder="Verification code" required><button id="codeSubmit">Verify code</button></form><p class="register-prompt" id="prompt">New user? <a id="register">Register now</a></p></main><script>
const $=x=>document.getElementById(x),form=$("form"),codeForm=$("codeForm"),error=$("error");let mode="login",email="";
function err(x){error.textContent=x;error.classList.add("visible")}function clear(){error.classList.remove("visible")}
function loading(button,label){button.disabled=true;button.innerHTML=`<span class="auth-loading"><span class="auth-spinner" aria-hidden="true"></span>${label}</span>`}function ready(button,label){button.disabled=false;button.textContent=label}
function setMode(next){mode=next;clear();$("title").textContent=next==="register"?"Create account":"Login";$("note").textContent=next==="register"?"Use your email and a password to get started.":"Sign in with your email and password.";ready($("submit"),next==="register"?"Create account":"Login");$("googleBtn").style.display="block";$("prompt").innerHTML=next==="login"?'New user? <a id="register">Register now</a>':'<a id="back">Back to login</a>';if($("register"))$("register").onclick=()=>setMode("register");if($("back"))$("back").onclick=()=>location.reload()}
$("register").onclick=()=>setMode("register");$("googleBtn").onclick=()=>{$("googleBtn").classList.add("loading");$("googleBtn").innerHTML='<span class="auth-loading"><span class="auth-spinner"></span>Signing in…</span>'};
form.onsubmit=async e=>{e.preventDefault();clear();email=$("email").value.trim().toLowerCase();const password=$("password").value;loading($("submit"),mode==="register"?"Creating account…":"Signing in…");try{const endpoint=mode==="register"?"/auth/register":"/auth/password-login";const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});const d=await r.json();if(!d.success){ready($("submit"),mode==="register"?"Create account":"Login");return err(d.message||"Unable to continue.")}if(mode==="login")return location.href="/apps/dashboard";codeForm.classList.add("visible");form.style.display="none";$("googleBtn").style.display="none";$("prompt").style.display="none";$("title").textContent="Verify email";$("note").textContent="Enter the 6-digit code sent to your email.";ready($("codeSubmit"),"Verify email");$("code").focus()}catch{ready($("submit"),mode==="register"?"Create account":"Login");err("Service temporarily unavailable.")}};
codeForm.onsubmit=async e=>{e.preventDefault();clear();loading($("codeSubmit"),"Verifying…");try{const r=await fetch("/auth/register/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,code:$("code").value.trim()})});const d=await r.json();if(!d.success){ready($("codeSubmit"),"Verify email");return err(d.message||"Invalid or expired code.")}location.href="/apps/dashboard"}catch{ready($("codeSubmit"),"Verify email");err("Verification service temporarily unavailable.")}};
</script></body></html>
