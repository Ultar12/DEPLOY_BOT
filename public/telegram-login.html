<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Ultar WBD</title><link rel="stylesheet" href="/styles.css"><style>
.login-page{min-height:100vh;display:grid;place-items:center;background:#000;padding:20px}.login-card{width:min(390px,100%);background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.45)}.login-card .brand{justify-content:center;margin-bottom:22px}.login-card h1{font-size:1.65rem;margin:0 0 22px;color:var(--ink)}.login-form{display:grid;gap:12px}.login-form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:6px;font:inherit;outline:none}.login-form button,.google-btn{border:0;border-radius:6px;padding:13px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}.google-btn{display:block;background:#fff;color:#172033;border:1px solid #d1d5db;text-decoration:none;margin-top:10px}.login-error{display:none;color:#b42318;font-size:.8rem;margin:10px 0 0}.login-error.visible{display:block}.register-prompt{margin:14px 0 0;color:var(--muted);font-size:.82rem}.register-prompt a{color:var(--blue);font-weight:700;cursor:pointer}.code-form{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.code-form.visible{display:grid;gap:10px}.code-form input{padding:12px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:center;letter-spacing:.18em}.code-form button{border:0;border-radius:6px;padding:12px;background:#1f9d63;color:#fff;font:inherit;font-weight:700;cursor:pointer}.mode-note{font-size:.8rem;color:var(--muted);margin:0 0 12px}
</style></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><img class="brand-logo" src="/ultar-sync-logo.jpg" alt="Ultar Sync logo"><span>Ultar WBD</span></a><h1 id="title">Login</h1><p class="mode-note" id="modeNote">Sign in with your email and password.</p><form class="login-form" id="loginForm"><input id="email" type="email" placeholder="Email address" autocomplete="email" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button type="submit">Login</button></form><a class="google-btn" href="/auth/google">Continue with Google</a><form class="code-form" id="codeForm"><input id="code" inputmode="numeric" maxlength="6" placeholder="Verification code" required><button type="submit">Verify code</button></form><p class="login-error" id="error"></p><p class="register-prompt" id="registerPrompt">New user? <a id="registerLink">Register now</a></p></main><script>
const $=id=>document.getElementById(id), loginForm=$('loginForm'), codeForm=$('codeForm'), error=$('error'), title=$('title'), note=$('modeNote'), registerPrompt=$('registerPrompt'); let mode='login', email='';
function showError(message){error.textContent=message;error.classList.add('visible')} function clearError(){error.classList.remove('visible')}
$('registerLink').onclick=()=>{mode='register';title.textContent='Create account';note.textContent='Use your email and a password to get started.';loginForm.querySelector('button').textContent='Create account';$('password').autocomplete='new-password';registerPrompt.innerHTML='Already have an account? <a id="registerLink">Log in</a>';$('registerLink').onclick=()=>location.reload();clearError()};
loginForm.onsubmit=async e=>{e.preventDefault();clearError();email=$('email').value.trim().toLowerCase();const password=$('password').value;try{const endpoint=mode==='register'?'/auth/register':'/auth/password-login';const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!d.success)return showError(d.message||'Unable to continue.');if(mode==='register'){codeForm.classList.add('visible');loginForm.style.display='none';$('title').textContent='Verify email';$('modeNote').textContent='Enter the 6-digit code sent to your email.';registerPrompt.style.display='none'}else location.href='/apps'}catch{showError('Service temporarily unavailable.')}};
codeForm.onsubmit=async e=>{e.preventDefault();clearError();try{const r=await fetch('/auth/register/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code:$('code').value.trim()})});const d=await r.json();if(!d.success)return showError(d.message||'Invalid or expired code.');location.reload()}catch{showError('Verification service temporarily unavailable.')}};
</script></body></html>
