<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultar WBD</title>
    <link rel="icon" href="/ultar-sync-logo.jpg">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="main-container">
        <div class="header">
            <a class="back-btn show" id="backBtn" href="/apps/dashboard"><</a>
            <a class="brand-lockup" href="/apps/dashboard"><img class="header-logo" src="/ultar-sync-logo.jpg" alt="Ultar WBD"><span><strong>Ultar WBD</strong></span></a>
            <nav class="app-nav">
                <a href="/apps/dashboard">Dashboard</a>
                <a href="/apps/session">Session</a>
                <a href="/apps/create">Deploy</a>
                <a href="/apps/plugins">Plugins</a>
            </nav>
            <div class="header-tools">
                <div class="account-area">
                    <button class="avatar-btn" id="avatarBtn" type="button">U</button>
                    <div class="account-menu" id="accountMenu">
                        <a href="/apps/settings">Account</a>
                        <a href="/apps/deployments">Deployments</a>
                        <a href="/apps/notifications" id="notificationsLink">Notifications</a>
                        <a href="/telegram-logout">Log out</a>
                    </div>
                </div>
            </div>
            <div id="headerTitle" hidden>Dashboard</div>
        </div>
        <div id="view-container"></div>
    </div>
    <script src="/wbd.js"></script>
    <script>
      const path = location.pathname;
      const home = path === '/apps' || path === '/app' || path === '/apps/dashboard';
      document.getElementById('backBtn')?.classList.toggle('show', !home);
      if (home) {
        const box = document.getElementById('view-container');
        const hero = '<div class="hero"><h1>Ultar WBD.</h1><p>Multi session WhatsApp bots built for performance.</p><div class="hero-btns"><a class="btn-solid" href="/apps/session">Get Session</a><a class="btn-outline" href="/apps/create">Deploy Now</a><a class="btn-outline" href="/apps/plugins">Get Plugins</a></div></div>';
        const paint = () => { if (box && !box.querySelector('.hero')) box.insertAdjacentHTML('afterbegin', hero); };
        if (box) new MutationObserver(paint).observe(box, { childList: true });
        paint();
      }
    </script>
</body>
</html>
