<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultar</title>
    <link rel="icon" href="/ultar-sync-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="main-container">
        <div class="app-top">
            <a class="mark" href="/apps/dashboard">Ultar</a>
            <nav class="app-links">
                <a href="/apps/session">Session</a>
                <a href="/apps/create">Deploy</a>
                <a href="/apps/plugins">Plugins</a>
                <a href="/apps/settings">Account</a>
            </nav>
        </div>
        <button class="back-btn" id="backBtn" type="button" hidden></button>
        <button class="avatar-btn" id="avatarBtn" type="button" hidden>U</button>
        <div class="account-menu" id="accountMenu" hidden></div>
        <a id="newAppBtn" href="/apps/create" hidden>Deploy</a>
        <a id="notificationsLink" href="/apps/notifications" hidden>Notifications</a>
        <div id="headerTitle" hidden></div>
        <div id="view-container"></div>
    </div>
    <script src="/wbd.js"></script>
    <script>
      document.querySelectorAll('.app-links a').forEach((a) => {
        if (location.pathname === a.getAttribute('href')) a.setAttribute('aria-current', 'page');
      });
    </script>
</body>
</html>
